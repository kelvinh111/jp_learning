<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1419">
  <link rel="manifest" href="manifest.webmanifest">
  <title>日語學習筆記</title>
  <!-- Anti-FOUC: apply saved theme before render -->
  <script>const _t=localStorage.getItem('theme');if(_t)document.documentElement.setAttribute('data-theme',_t);</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ── CSS variables: light (default) ── */
    :root {
      --c-bg:       #f8fafc;
      --c-surface:  #ffffff;
      --c-sidebar:  #ffffff;
      --c-header:   rgba(255,255,255,0.95);
      --c-border:   #e5e7eb;
      --c-text:     #1f2937;
      --c-muted:    #5f6772;
      --c-rt:       #6b7280;
      --c-accent:   #d97706;
      --c-acc-bg:   #fff4e8;
      --c-acc-bd:   #f6c998;
      --c-h1:       #b45309;
      --c-h2:       #c96a10;
      --c-h3:       #374151;
      --c-strong:   #b45309;
      --c-hr:       #e5e7eb;
      --c-th-bg:    #fff7ed;
      --c-th:       #b45309;
      --c-td-even:  #f9fafb;
      --c-code-bg:  #f3f4f6;
      --c-code:     #b45309;
      --c-quote:    #6b7280;
    }

    /* ── CSS variables: dark ── */
    [data-theme="dark"] {
      --c-bg:       #0d1117;
      --c-surface:  #161b22;
      --c-sidebar:  #0d1117;
      --c-header:   rgba(13,17,23,0.97);
      --c-border:   #21262d;
      --c-text:     #dbe2ea;
      --c-muted:    #a7b2be;
      --c-rt:       #9ea9b5;
      --c-accent:   #ffb15c;
      --c-acc-bg:   #2a1b0d;
      --c-acc-bd:   #5f3c1e;
      --c-h1:       #ffc98d;
      --c-h2:       #ffb15c;
      --c-h3:       #c1cbd6;
      --c-strong:   #ffc98d;
      --c-hr:       #21262d;
      --c-th-bg:    #2a1b0d;
      --c-th:       #ffc98d;
      --c-td-even:  #0d1117;
      --c-code-bg:  #161b22;
      --c-code:     #f0883e;
      --c-quote:    #a7b2be;
    }

    html {
      scroll-behavior: smooth;
      height: 100%;
      overflow: hidden;
    }
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--c-bg);
      color: var(--c-text);
    }

    /* ── Structural overrides (Tailwind static → CSS var) ── */
    header                   { background: var(--c-header)  !important; border-color: var(--c-border) !important; }
    #sidebar                 { background: var(--c-sidebar) !important; border-color: var(--c-border) !important; }
    #main                    { background: var(--c-bg); min-height: 0; }
    #toc-drawer > div:last-child { background: var(--c-surface) !important; }
    #toc-drawer .border-b    { border-color: var(--c-border) !important; }
    #toc-drawer .font-semibold { color: var(--c-text) !important; }
    #btn-toc                 { color: var(--c-muted) !important; border-color: var(--c-border) !important; }
    #btn-toc:hover           { background: var(--c-surface) !important; }
    #btn-toc-close           { color: var(--c-muted); }
    #sidebar > div > p       { color: var(--c-muted) !important; }
    header .font-bold        { color: var(--c-h1) !important; }

    /* ── Furigana ── */
    ruby rt { font-size: 0.6em; color: var(--c-rt); font-weight: 500; }

    /* ── Rendered Markdown ── */
    #content {
      font-size: clamp(1rem, 0.92rem + 0.3vw, 1.15rem);
    }
    #content h1 {
      font-size: clamp(1.45rem, 1.25rem + 0.7vw, 1.95rem); font-weight: 700; color: var(--c-h1);
      border-bottom: 2px solid var(--c-acc-bg);
      padding-bottom: 0.5rem; margin-top: 2.5rem; margin-bottom: 1rem; scroll-margin-top: 4rem;
    }
    #content h2 {
      font-size: clamp(1.12rem, 1rem + 0.35vw, 1.35rem); font-weight: 600; color: var(--c-h2);
      margin-top: 1.75rem; margin-bottom: 0.4rem; scroll-margin-top: 4rem;
    }
    #content h3 {
      font-size: clamp(1rem, 0.94rem + 0.2vw, 1.15rem); font-weight: 600; color: var(--c-h3);
      margin-top: 1rem; margin-bottom: 0.25rem;
    }
    #content p  { margin: 0.35rem 0; line-height: 1.85; color: var(--c-text); }
    #content ul { list-style: disc; padding-left: 1.5rem; margin: 0.4rem 0; }
    #content li { margin: 0.2rem 0; line-height: 1.75; color: var(--c-text); }
    #content strong { font-weight: 600; color: var(--c-strong); }
    #content hr { border: none; border-top: 1px solid var(--c-hr); margin: 1.25rem 0; }
    #content table { border-collapse: collapse; width: 100%; margin: 0.75rem 0; font-size: 0.85rem; }
    #content th {
      background: var(--c-th-bg); padding: 0.45rem 0.75rem; text-align: left;
      border: 1px solid var(--c-acc-bd); font-weight: 600; color: var(--c-th);
    }
    #content td { padding: 0.4rem 0.75rem; border: 1px solid var(--c-border); vertical-align: top; color: var(--c-text); }
    #content tr:nth-child(even) td { background: var(--c-td-even); }
    #content code {
      background: var(--c-code-bg); padding: 0.1rem 0.3rem; border-radius: 3px;
      font-family: 'Menlo','Consolas',monospace; font-size: 0.875em; color: var(--c-code);
    }
    #content blockquote {
      border-left: 3px solid var(--c-accent); padding: 0.1rem 0 0.1rem 1rem;
      margin: 0.5rem 0; color: var(--c-quote);
    }

    /* ── Sidebar scrollbar ── */
    #sidebar { scrollbar-width: thin; scrollbar-color: var(--c-border) transparent; }
    #sidebar::-webkit-scrollbar { width: 4px; }
    #sidebar::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 2px; }

    /* ── TOC links ── */
    .toc-link {
      display: block; padding: 0.3rem 0.6rem; border-radius: 6px;
      font-size: clamp(0.82rem, 0.78rem + 0.12vw, 0.92rem); color: var(--c-muted); cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .toc-link:hover  { background: var(--c-acc-bg); color: var(--c-accent); }
    .toc-link.active {
      background: var(--c-acc-bg); color: var(--c-accent); font-weight: 600;
      border-left: 2px solid var(--c-accent); padding-left: calc(0.6rem - 2px);
    }

    /* ── Theme toggle ── */
    #btn-theme { color: var(--c-muted); transition: color 0.15s; }
    #btn-theme:hover { color: var(--c-text); }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-gray-200 shadow-sm">
    <div class="flex items-center justify-between px-4 h-14 max-w-screen-2xl mx-auto">
      <span class="font-bold text-indigo-900 text-base tracking-wide">📖 日語學習筆記</span>
      <div class="flex items-center gap-2">
      <a href="quiz.html" class="hidden sm:inline-flex items-center gap-1.5 text-sm border rounded-lg px-3 py-1.5" style="color: var(--c-muted); border-color: var(--c-border); background: var(--c-surface);">
        測驗 App
      </a>
      <!-- Dark/Light toggle -->
      <button id="btn-theme" class="p-2 rounded-lg" title="切換深色/淺色">
        <svg id="icon-moon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/></svg>
        <svg id="icon-sun" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m8.66-9h-1M4.34 12h-1m15.07-6.07l-.71.71M5.64 18.36l-.71.71M18.36 18.36l-.71-.71M5.64 5.64l-.71-.71M12 7a5 5 0 100 10A5 5 0 0012 7z"/></svg>
      </button>
      <button id="btn-toc" class="md:hidden flex items-center gap-1.5 text-sm text-gray-600 border border-gray-300 rounded-lg px-3 py-1.5 hover:bg-gray-100">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h10"/>
        </svg>
        目錄
      </button>
      <a href="quiz.html" class="md:hidden flex items-center gap-1.5 text-sm border rounded-lg px-3 py-1.5" style="color: var(--c-muted); border-color: var(--c-border); background: var(--c-surface);">
        測驗
      </a>
      </div>
    </div>
  </header>

  <!-- ── Layout ── -->
  <div class="flex" style="height: calc(100vh - 3.5rem);">

    <!-- Desktop Sidebar -->
    <aside id="sidebar" class="hidden md:flex flex-col w-60 flex-shrink-0 bg-white border-r border-gray-200 overflow-y-auto">
      <div class="p-3 pt-4">
        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2 px-1">目次</p>
        <nav id="toc-desktop"></nav>
      </div>
    </aside>

    <!-- Main -->
    <main id="main" class="flex-1 overflow-y-auto relative">
      <div id="content" class="max-w-2xl mx-auto px-5 py-6">
        <p class="text-gray-400 text-center py-20 text-base">載入中...</p>
      </div>

      <!-- Back to top -->
      <button id="btn-top"
        class="fixed bottom-6 right-5 hidden bg-indigo-600 text-white rounded-full w-10 h-10 shadow-lg items-center justify-center hover:bg-indigo-700 transition-colors"
        style="display:none">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/>
        </svg>
      </button>
    </main>
  </div>

  <!-- ── Mobile TOC Drawer ── -->
  <div id="toc-drawer" class="fixed inset-0 z-50 hidden">
    <div id="toc-backdrop" class="absolute inset-0 bg-black/40"></div>
    <div class="absolute left-0 top-0 bottom-0 w-72 bg-white shadow-xl flex flex-col">
      <div class="flex justify-between items-center px-4 py-3 border-b border-gray-100">
        <span class="font-semibold text-gray-700 text-sm">目次</span>
        <button id="btn-toc-close" class="text-gray-400 hover:text-gray-600 p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto p-3">
        <nav id="toc-mobile"></nav>
      </div>
    </div>
  </div>

  <script>
    // ── Theme management ──
    function updateThemeIcon() {
      const dark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.getElementById('icon-moon').classList.toggle('hidden', !dark);
      document.getElementById('icon-sun').classList.toggle('hidden',  dark);
    }
    updateThemeIcon();
    document.getElementById('btn-theme').addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeIcon();
    });

    // ── Convert 漢字(かな) to <ruby> tags ──
    function addFurigana(text) {
      // Match CJK characters immediately followed by (hiragana)
      return text.replace(/([\u4e00-\u9fff\u3400-\u4dbf々]+)\(([ぁ-ん]+)\)/g,
        '<ruby>$1<rt>$2</rt></ruby>');
    }

    // ── Build TOC from rendered h1 elements ──
    function buildTOC() {
      const headings = document.querySelectorAll('#content h1');
      const desktopNav = document.getElementById('toc-desktop');
      const mobileNav  = document.getElementById('toc-mobile');

      headings.forEach((h, i) => {
        h.id = 'ch-' + i;
        const label = h.textContent.replace(/\*/g, '').trim();

        [desktopNav, mobileNav].forEach(nav => {
          const a = document.createElement('a');
          a.href = '#ch-' + i;
          a.textContent = label;
          a.className = 'toc-link';
          a.dataset.idx = i;
          a.addEventListener('click', () => {
            closeMobileTOC();
          });
          nav.appendChild(a);
        });
      });
    }

    // ── Active TOC item tracking via IntersectionObserver ──
    function initScrollSpy() {
      const headings = document.querySelectorAll('#content h1');
      let currentId = null;

      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            currentId = entry.target.id;
            highlightTOC(currentId);
          }
        });
      }, { rootMargin: '-56px 0px -70% 0px' });

      headings.forEach(h => observer.observe(h));
    }

    function highlightTOC(id) {
      document.querySelectorAll('.toc-link').forEach(a => {
        const active = a.href.endsWith('#' + id);
        a.classList.toggle('active', active);
      });
    }

    // ── Mobile drawer ──
    function closeMobileTOC() {
      document.getElementById('toc-drawer').classList.add('hidden');
    }
    document.getElementById('btn-toc').addEventListener('click', () => {
      document.getElementById('toc-drawer').classList.remove('hidden');
    });
    document.getElementById('btn-toc-close').addEventListener('click', closeMobileTOC);
    document.getElementById('toc-backdrop').addEventListener('click', closeMobileTOC);

    // ── Back to top button ──
    const main = document.getElementById('main');
    const btnTop = document.getElementById('btn-top');
    main.addEventListener('scroll', () => {
      btnTop.style.display = main.scrollTop > 400 ? 'flex' : 'none';
    });
    btnTop.addEventListener('click', () => {
      main.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // ── Load & render markdown ──
    marked.setOptions({ gfm: true, breaks: true });

    fetch('Note.md')
      .then(r => {
        if (!r.ok) throw new Error(r.status);
        return r.text();
      })
      .then(md => {
        const html = marked.parse(addFurigana(md));
        document.getElementById('content').innerHTML = html;
        buildTOC();
        initScrollSpy();
      })
      .catch(() => {
        document.getElementById('content').innerHTML = `
          <div class="rounded-xl border border-red-200 bg-red-50 p-6 mt-8">
            <p class="font-semibold text-red-700 mb-2">⚠️ 無法直接開啟</p>
            <p class="text-gray-600 text-sm mb-3">瀏覽器安全限制不允許直接讀取本地檔案，需要用本地伺服器開啟。</p>
            <p class="text-gray-700 text-sm font-medium mb-1">方法一：Python（在 jp_learning 資料夾執行）</p>
            <code class="block bg-gray-800 text-green-400 rounded-lg px-4 py-2 text-sm mb-3">python -m http.server 8000</code>
            <p class="text-gray-700 text-sm font-medium mb-1">方法二：VS Code Live Server 擴充功能</p>
            <p class="text-gray-500 text-xs">安裝後對 index.html 按右鍵 → Open with Live Server</p>
          </div>`;
      });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((err) => {
          console.error("Service worker registration failed", err);
        });
      });
    }
  </script>
</body>
</html>
